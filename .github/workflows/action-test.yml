name: Nuxt Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Generate Nuxt static site
      - name: Generate static site
        run: npm run generate

      # 5️⃣ Optional: check .output folder
      - name: Check Nuxt output
        run: ls -R .output

      # 6️⃣ Upload .output directly to VPS
      - name: Upload new build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".output/*"           # upload contents of .output
          target: "/home/mtech-marketing/app_backup/"  # temporary folder on VPS
          recursive: true               # ensure all subfolders are copied
          preserve: true                # preserve file permissions and timestamps (-p flag)

      # 7️⃣ Backup old site and move new build
      - name: Backup old site and move new build
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Ensure backup folder exists
            rm -rf /home/mtech-marketing/old_app

            # Backup current app if it exists
            if [ -d /home/mtech-marketing/app ]; then
              cp -r /home/mtech-marketing/app /home/mtech-marketing/old_app
            fi

            # Remove current app
            rm -rf /home/mtech-marketing/app

            # Restore app from backup
            cp -r /home/mtech-marketing/app_backup/* /home/mtech-marketing/app

            # Remove app_backup folder
            rm -rf /home/mtech-marketing/app_backup
