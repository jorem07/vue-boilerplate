name: Nuxt Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-dist
          path: .output   # <-- all of .output, like your manual scp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nuxt-dist
          path: app_backup  # <-- temporary folder on runner

      - name: Upload new build to VPS (app_backup)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "app_backup/*"  # <-- all files inside .output
          target: /home/mtech-marketing/app_backup

      - name: Backup old site and move new build
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backup current live site if it exists
            mkdir -p /home/mtech-marketing/old_app
            if [ -d /home/mtech-marketing/app ]; then
              mv /home/mtech-marketing/app/* /home/mtech-marketing/old_app/
            fi

            # Move new build from app_backup to app
            mv /home/mtech-marketing/app_backup/* /home/mtech-marketing/app/
